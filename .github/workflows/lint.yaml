name: golangci-lint
on:
  push:
    branches:
      - main
    paths-ignore:
    - 'README.md'
    - '.github/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      # golangci-lint-action has no go-version input of its own and, left unpinned, installs
      # whatever Go is currently "stable" -- observed installing 1.26.5 against this module's
      # go.mod-declared `go 1.21`. That skew causes golangci-lint's type-checking-based linters
      # (govet, staticcheck, gosimple, ...) to blow up to 6GB+ RSS and hang well past their own
      # --timeout. Pinning Go here to match go.mod resolves it.
      - uses: actions/setup-go@v4
        with:
          go-version: "1.21"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v2
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          version: latest

          # Optional: working directory, useful for monorepos
          # working-directory: somedir

          # Optional: golangci-lint command line arguments.
          args: --timeout=5m

          # Optional: show only new issues if it's a pull request. The default value is `false`.
          # only-new-issues: true

          # Use the Go version pinned above instead of letting the action install its own.
          skip-go-installation: true

          # Optional: if set to true then the action don't cache or restore ~/go/pkg.
          # skip-pkg-cache: true

          # Optional: if set to true then the action don't cache or restore ~/.cache/go-build.
          # skip-build-cache: true
